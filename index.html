<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UMV — Upload a file</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="upload-page">

  <main class="upload-card" role="main" aria-label="Upload a file">
    <div class="upload-card__icon" id="uploadIcon"></div>
    <h1 class="upload-card__title">Upload a file</h1>
    <p class="upload-card__desc">Attach the file below</p>

    <div class="dropzone" id="dropzone"></div>
    <input type="file" id="fileInput" multiple hidden />

    <div class="upload-card__foot">
      <button class="btn btn--ghost" id="uploadCancel">Cancel</button>
      <button class="btn btn--primary" id="uploadSubmit">Upload file</button>
    </div>
  </main>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/upload.js"></script>
</body>
</html>
